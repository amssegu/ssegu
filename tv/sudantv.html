<style>

.back-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#c0c0d0;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;background:#16161d;border:1px solid rgba(255,255,255,.1)}
.back-link:hover{border-color:#e11d48;color:#fff}
.channel-title{font-size:18px;font-weight:800;color:#fff}
.player-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);aspect-ratio:16/9;max-height:70vh}
#mainVideo{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:5;cursor:pointer}

.play-btn{width:72px;height:72px;border-radius:50%;background:#e11d48;color:#fff;border:none;font-size:28px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(225,29,72,.4)}

.load-text{color:#fff;font-weight:700;font-size:15px}
.error-box{text-align:center;padding:20px}
.error-box p{color:#fca5a5;margin-bottom:12px;font-weight:700}
.retry-btn{appearance:none;border:none;background:#e11d48;color:#fff;font-weight:800;padding:10px 18px;border-radius:10px;cursor:pointer}
.meta-bar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:8px}
.live-badge{background:#e11d48;color:#fff;font-size:11px;font-weight:900;padding:4px 10px;border-radius:6px;text-transform:uppercase}

.footer{margin-top:32px;border-top:1px solid rgba(255,255,255,.06);background:#0a0a0d;text-align:center;padding:18px 14px;font-size:12px;color:#a0a0b0}
.footer a{color:#c0c0d0;margin:0 6px}
.tv-ad{margin:20px 0;text-align:center}
.tv-ad-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#9a9aa8;margin-bottom:6px;font-weight:700}
</style>
</head>
<body>
<div class="top-ad-wrap">
  <div class="top-ad-inner">
    <div class="top-ad-label">Advertisement</div>
    <div class="top-ad-box">
      <ins class="adsbygoogle"
           data-ad-client="ca-pub-7777536386845474"
           data-ad-slot="9970802556"
           data-ad-format="horizontal"
           data-full-width-responsive="true"
           style="display:block;min-height:90px;width:100%"></ins>
    </div>
  </div>
</div>
<div class="wrap">
  <div class="brand">
    <h1>SSEGU <span>📺</span> Live TV</h1>
    <p>Watch free live TV channels</p>
  </div>
  <div class="back-row">
    <a class="back-link" href="https://www.ssegu.com/tv/">← Back to Channels</a>
    <div class="channel-title" id="currentChannelName">Sudan TV</div>
  </div>
  <div class="player-wrap">
    <video id="mainVideo" playsinline controls preload="metadata"></video>
    <div class="overlay" id="playOverlay">
      <button class="play-btn" id="mainPlayBtn" type="button" aria-label="Play">▶</button>
      <div class="hint">Tap to play Sudan TV</div>
    </div>
    <div class="overlay hidden" id="loadOverlay">
      <div class="load-text" id="loadText">Connecting…</div>
    </div>
    <div class="overlay hidden" id="errorOverlay">
      <div class="error-box">
        <p>Unable to load stream. Please try again.</p>
        <button class="retry-btn" id="retryBtn" type="button">Retry</button>
      </div>
    </div>
  </div>
  <div class="meta-bar">
    <span class="live-badge">● LIVE</span>
    <span class="cat">News</span>
  </div>
  <div class="tv-ad">
    <div class="tv-ad-label">Advertisement</div>
    <ins class="adsbygoogle"
         data-ad-client="ca-pub-7777536386845474"
         data-ad-slot="9970802556"
         data-ad-format="auto"
         data-full-width-responsive="true"
         style="display:block;min-height:100px"></ins>
  </div>
</div>
<footer class="footer">
  <a href="https://www.ssegu.com/tv/">Home</a>
  <a href="https://www.ssegu.com/p/contact-us.html" target="_blank" rel="noopener">Contact</a>

  <a href="https://www.ssegu.com/p/terms-and-conditions.html" target="_blank" rel="noopener">Terms</a>
  <p style="margin-top:10px;color:#aaa">© SSEGU. All rights reserved.</p>
</footer>
<script>
(function(){
"use strict";
var STREAM_URL = "https://cdn-globecast.akamaized.net/live/eds/sudan_tv/hls_roku/index.m3u8";
var CHANNEL_NAME = "Sudan TV";
function pushAds(){
  document.querySelectorAll("ins.adsbygoogle:not([data-adsbygoogle-status])").forEach(function(ad){
    try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(e){}
  });
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", pushAds);
} else {
  pushAds();
}
var mainVideo = document.getElementById("mainVideo");
var playOverlay = document.getElementById("playOverlay");
var loadOverlay = document.getElementById("loadOverlay");
var errorOverlay = document.getElementById("errorOverlay");
var loadText = document.getElementById("loadText");
var mainPlayBtn = document.getElementById("mainPlayBtn");
var retryBtn = document.getElementById("retryBtn");
var currentHls = null;
var loadTimeout = null;
var isPlaying = false;
function showOnly(which){
  if(playOverlay) playOverlay.classList.toggle("hidden", which !== "play");
  if(loadOverlay) loadOverlay.classList.toggle("hidden", which !== "load");
  if(errorOverlay) errorOverlay.classList.toggle("hidden", which !== "error");
}
function destroyHls(){
  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }
  if(loadTimeout){ clearTimeout(loadTimeout); loadTimeout = null; }
}
function showError(){
  destroyHls();
  isPlaying = false;
  showOnly("error");
}
function showLoading(msg){
  if(loadText) loadText.textContent = msg || "Connecting…";
  showOnly("load");
}
function attachStream(url, autoPlay){
  destroyHls();
  if(!mainVideo) return;
  mainVideo.removeAttribute("src");
  try{ mainVideo.load(); }catch(e){}
  var resolved = false;
  function onReady(){
    if(resolved) return;
    resolved = true;
    if(loadTimeout){ clearTimeout(loadTimeout); loadTimeout = null; }
    if(autoPlay){
      mainVideo.play().then(function(){
        isPlaying = true;
        showOnly("none");
      }).catch(function(){
        isPlaying = false;
        showOnly("play");
      });
    }
  }
  loadTimeout = setTimeout(function(){
    if(!resolved) showError();
  }, 18000);
  if(window.Hls && Hls.isSupported()){
    currentHls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 60,
      maxBufferLength: 30,
      manifestLoadingTimeOut: 12000,
      levelLoadingTimeOut: 12000,
      fragLoadingTimeOut: 15000
    });
    currentHls.loadSource(url);
    currentHls.attachMedia(mainVideo);
    currentHls.on(Hls.Events.MANIFEST_PARSED, function(){ onReady(); });
    currentHls.on(Hls.Events.ERROR, function(ev, data){
      if(!data.fatal) return;
      if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
        try{ currentHls.startLoad(); }catch(e){ showError(); }
      } else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
        try{ currentHls.recoverMediaError(); }catch(e){ showError(); }
      } else {
        showError();
      }
    });
  } else if(mainVideo.canPlayType("application/vnd.apple.mpegurl")){
    mainVideo.src = url;
    mainVideo.addEventListener("loadedmetadata", onReady, { once: true });
    mainVideo.addEventListener("error", function(){ showError(); }, { once: true });
  } else {
    mainVideo.src = url;
    mainVideo.addEventListener("loadedmetadata", onReady, { once: true });
    mainVideo.addEventListener("error", function(){ showError(); }, { once: true });
  }
  mainVideo.addEventListener("error", function(){
    if(!resolved) showError();
  }, { once: true });
}
function startPlay(){
  showLoading("Connecting to " + CHANNEL_NAME + "…");
  attachStream(STREAM_URL, true);
}
if(mainPlayBtn){
  mainPlayBtn.addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation();
    startPlay();
  });
}
if(playOverlay){
  playOverlay.addEventListener("click", function(e){
    if(e.target === playOverlay || e.target.classList.contains("hint")){
      e.preventDefault();
      startPlay();
    }
  });
}
if(retryBtn){
  retryBtn.addEventListener("click", function(e){
    e.preventDefault();
    startPlay();
  });
}
document.addEventListener("keydown", function(e){
  if(isPlaying) return;
  if(e.key === "Enter" || e.key === " " || e.key === "MediaPlayPause"){
    e.preventDefault();
    startPlay();
  }
});
if(mainVideo){
  mainVideo.addEventListener("playing", function(){
    isPlaying = true;
    showOnly("none");
  });
  mainVideo.addEventListener("waiting", function(){
    if(isPlaying) showLoading("Buffering…");
  });
  mainVideo.addEventListener("canplay", function(){
    if(isPlaying) showOnly("none");
  });
}
/* Preload metadata only */
attachStream(STREAM_URL, false);
showOnly("play");
})();
</script>
</body>
</html>
